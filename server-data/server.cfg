## Server name, description, tags and banners are set at https://portal.cfx.re/servers
## Your license key and database password are in secrets.cfg

exec secrets.cfg

## Network ##
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
# OneSync is switched on in start-server.bat. It can't be set from this file.
sv_enforceGameBuild 3258
set steam_webApiKey "none"

# Hides the server from the public list while it's being built.
# Remove this line when you're ready to go public.
set sv_master1 ""

## Chat ##
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined the server"
set qbx_chat:quitMessage "^1%s left the server (%s)"

exec voice.cfg

## Qbox ##
setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink ""
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"
setr qbx:motd "<p style='padding: 1rem; background-color: #141517; border: 1px solid #373a40; border-radius: 0.5rem; text-align: center;'><span style='color: rgb(200, 200, 40);'>Welcome to the city!</span></p>"

setr illenium-appearance:locale "en"
setr weather_disablecd true

exec ox.cfg

## Phone ##
set npwd:framework "qbx"
# Optional, needed for phone camera and voice messages:
# https://projecterror.dev/docs/npwd/start/installation#setting-up-camera-functionality
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

## Loading screen ##
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#f1e542"
set loadscreen:shadowColor "#1a18077f"

## Resources. Order matters: the core must start before anything that uses it. ##
ensure mapmanager
ensure chat
ensure spawnmanager
ensure baseevents

ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [assets]

ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

# Everything written for this server goes in resources/[custom]
ensure [custom]

## Permissions ##
exec permissions.cfg

## Miscellaneous ##
exec misc.cfg
