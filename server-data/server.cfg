## Server name, description, tags and banners are set at https://portal.cfx.re/servers
## Your license key and database password are in secrets.cfg

exec secrets.cfg

## Network ##
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
# OneSync is switched on in start-server.bat. It can't be set from this file.
sv_enforceGameBuild 3258
set steam_webApiKey "none"

# The server is listed publicly. To hide it from the server list again, add back:
# set sv_master1 ""

## Chat ##
set resources_useSystemChat true
# Highcrest: no join or leave messages in chat
set qbx_chat:joinMessage ""
set qbx_chat:quitMessage ""

# Highcrest: F4 is the Highcrest emote menu and F5 is kept for the ERP emote menu, so
# scully_emotemenu's own menu gets no default key (/em still opens it).
setr scully_emotemenu:menuKeybind ""

exec voice.cfg

## Qbox ##
setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "https://discord.gg/Se7Sx7nnkv"
set qbx:max_jobs_per_player 2
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"
# Highcrest: no welcome banner in chat
setr qbx:motd ""

setr weather_disablecd true

exec ox.cfg

# oxmysql logs slow queries with their data, which floods the console with photo data.
set mysql_slow_query_warning 5000

## Resources. Order matters: the core must start before anything that uses it. ##
ensure mapmanager
ensure chat
ensure spawnmanager
ensure baseevents

ensure ox_lib
ensure qbx_core
# Targeting first (sleepless_interact stands in for ox_target), then the inventory, then shops that read its items
ensure sleepless_interact
ensure ox_inventory
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [assets]
# Add-on cars (Eternium pack, engine sounds). Uploaded from D:\highcrest_cars, not kept in git.
ensure [cars]

# Bought scripts. highcrest_sql sets up their database tables first.
# Replaced resources are kept in resources/[disabled], which is not started.
ensure highcrest_sql
# mka-lasers must be running before drc_moneywash, which loads its laser code.
ensure mka-lasers
ensure [scripts]
# RTX Shell Creator (admin /shellcreator). Assets must start before the creator.
ensure rtx_shellcreator_assets
ensure rtx_shellcreator
ensure rtx_custom_shells
ensure rtx_custom_mlos
# Let the shell creator write the shells it finishes into these resources (newer server sandbox).
add_filesystem_permission rtx_shellcreator write rtx_custom_shells
add_filesystem_permission rtx_shellcreator write rtx_custom_mlos
add_filesystem_permission rtx_shellcreator write rtx_shellcreator_walk
# Scripts being tried out before they move to [scripts].
# Turn on when the testing batch is uploaded:
# ensure [testing]

# Everything written for this server goes in resources/[custom]
ensure [custom]

## Permissions ##
exec permissions.cfg

## Miscellaneous ##
exec misc.cfg
