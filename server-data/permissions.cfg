add_ace group.admin command allow # allow all commands

# Resources
add_ace resource.qbx_core command allow # Allow qbx_core to execute commands

# Ox_lib
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

# Ace Groups
add_ace group.admin admin allow
add_ace group.mod mod allow
add_ace group.support support allow

# Inheritance
add_principal group.admin group.mod
add_principal group.mod group.support

# Owners with in-game admin (FiveM account IDs). The first owner is in secrets.cfg.
add_principal identifier.fivem:8089178 group.admin # ChillyMoth4656
add_principal identifier.fivem:1670014 group.admin # SlowAnt8494

# Admins by Discord account (works when their Discord is linked to FiveM).
add_principal identifier.discord:429060029342154772 group.admin # Gracie
add_principal identifier.discord:733120302489534474 group.admin # Ash
add_principal identifier.discord:249696922334396416 group.admin # Tanor
add_principal identifier.discord:199508907444404224 group.admin # Rusty

# RTX Shell Creator: admins open /shellcreator; the resource may refresh/start the shells it builds
add_ace group.admin rtxshellcreator.admin allow
add_ace resource.rtx_shellcreator command.refresh allow
add_ace resource.rtx_shellcreator command.ensure allow
add_ace resource.rtx_shellcreator command.start allow
add_ace resource.rtx_shellcreator command.stop allow
