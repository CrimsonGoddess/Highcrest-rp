<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Highcrest RP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="backdrop"></div>

    <div class="stage">
        <header class="hero">
            <img class="banner" src="assets/background.png" alt="Highcrest RP">
            <p class="tagline">Everybody wants the top. Not everybody makes it.</p>
        </header>

        <main class="panel">
            <div class="readout">
                <p id="message" class="message"></p>
                <p class="percent"><span id="percent">0</span><small>%</small></p>
            </div>

            <div id="tach" class="tach" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="ticks" class="ticks"></div>
                <div class="track">
                    <div class="redzone"></div>
                    <div id="fill" class="fill"></div>
                    <div id="tip" class="tip"></div>
                </div>
            </div>

            <p id="status" class="status">Connecting to the city</p>
        </main>
    </div>

    <div class="music" aria-label="Music">
        <button id="musicToggle" class="music-toggle" type="button" aria-label="Mute music">
            <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
            <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
        <div class="music-info">
            <span class="music-label">Now playing</span>
            <span class="music-title">Born for the Night</span>
        </div>
        <input id="musicVolume" class="music-volume" type="range" min="0" max="100" step="1" aria-label="Music volume">
    </div>

    <audio id="music" src="assets/music.mp3" loop preload="auto"></audio>

    <script src="main.js"></script>
</body>
</html>
