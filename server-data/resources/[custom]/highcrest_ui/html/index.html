<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Highcrest UI</title>
    <style>
        @font-face {
            font-family: 'Rajdhani';
            src: url('assets/fonts/rajdhani-latin-500-normal.woff2') format('woff2');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Rajdhani';
            src: url('assets/fonts/rajdhani-latin-700-normal.woff2') format('woff2');
            font-weight: 700;
        }

        @font-face {
            font-family: 'Cinzel';
            src: url('assets/fonts/cinzel-latin-600-normal.woff2') format('woff2');
            font-weight: 600;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }

        /* To move the badge, change top and left. To resize it, change the icon size and font-size. */
        #badge {
            position: fixed;
            top: 1.4vh;
            right: 1.6vh;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #brand {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1vh;
        }

        #stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.6vh;
            max-width: 34vh;
            margin-block-start: 0.8vh;
            margin-inline-start: auto;
            font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
            font-size: 1.6vh;
            line-height: 1;
        }

        .bubble {
            display: flex;
            align-items: baseline;
            gap: 0.6vh;
            padding: 0.6vh 1.1vh;
            border: 0.1vh solid rgba(212, 175, 55, 0.45);
            border-radius: 2vh;
            background: rgba(11, 11, 13, 0.78);
            color: #f5f5f5;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .bubble small {
            color: #b4b4bd;
            font-size: 0.82em;
            font-weight: 500;
        }

        .bubble.money {
            color: #d4af37;
        }

        .bubble.job {
            border-color: rgba(200, 16, 46, 0.75);
        }

        [hidden] {
            display: none !important;
        }

        #badge.visible {
            opacity: 0.95;
        }

        #icon {
            width: 5.6vh;
            height: 5.6vh;
            border-radius: 50%;
            box-shadow: 0 0 1.2vh rgba(0, 0, 0, 0.6);
        }

        #name {
            color: #d4af37;
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 600;
            font-size: 2.3vh;
            letter-spacing: 0.05em;
            white-space: nowrap;
            text-shadow: 0 0.1vh 0.5vh #000, 0 0 1.2vh rgba(0, 0, 0, 0.8);
        }

        #name span {
            color: #e0203c;
        }

        /* Compass, attached to the top edge: a thin crimson line with ticks hanging from it,
           fading out at both ends. --span is the line width for its field of view. */
        #compass {
            --span: 84vh;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #compass.visible {
            opacity: 0.92;
        }

        #compassBar {
            position: relative;
            width: var(--span);
            height: 2.6vh;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
        }

        #compassBar::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 0.3vh;
            background: #c8102e;
            box-shadow: 0 0 0.8vh rgba(200, 16, 46, 0.7);
        }

        #tape {
            position: absolute;
            inset: 0;
            will-change: transform;
        }

        .tick {
            position: absolute;
            top: 0.3vh;
            width: 0.14vh;
            height: 0.4vh;
            background: rgba(245, 245, 245, 0.55);
            transform: translateX(-50%);
        }

        .tick.major {
            height: 0.75vh;
            background: rgba(245, 245, 245, 0.85);
        }

        .heading-label {
            position: absolute;
            top: 0.85vh;
            color: #f5f5f5;
            font-size: 1.6vh;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-shadow: 0 0.1vh 0.4vh rgba(0, 0, 0, 0.9);
            transform: translateX(-50%);
        }

        .heading-label.north {
            color: #e0203c;
            font-weight: 700;
        }

        #pointer {
            position: absolute;
            top: 0;
            left: 50%;
            width: 0;
            height: 0;
            border-inline: 0.65vh solid transparent;
            border-top: 0.95vh solid #f5f5f5;
            filter: drop-shadow(0 0.1vh 0.3vh rgba(0, 0, 0, 0.8));
            transform: translateX(-50%);
            z-index: 2;
        }

        /* Markers sit on the line, with their distance under them. */
        .marker {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            transform: translateX(-50%);
            z-index: 1;
        }

        .marker i {
            width: 0.9vh;
            height: 0.9vh;
            margin-top: 0.15vh;
            border-radius: 50%;
            background: var(--colour);
            box-shadow: 0 0 0.6vh var(--colour);
        }

        .marker span {
            color: var(--colour);
            font-size: 1vh;
            font-weight: 700;
            text-shadow: 0 0.1vh 0.3vh #000;
            white-space: nowrap;
        }

        #street {
            margin-top: -0.2vh;
            color: #f5f5f5;
            font-size: 1.8vh;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-align: center;
            text-shadow: 0 0.1vh 0.4vh rgba(0, 0, 0, 0.95), 0 0 1vh rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }

        #street small {
            margin-inline-start: 0.8vh;
            color: #d4af37;
            font-size: 0.85em;
        }

        #street small:not(:empty)::before {
            content: '· ';
            color: rgba(245, 245, 245, 0.6);
        }

        /* Minimap border: crimson frame with gold corner accents. Defaults were lined up in-game on a 1080p screen; players fine-tune with /hudborder. */
        #mapFrame {
            position: fixed;
            left: calc(2vh + var(--mb-x, 0) * 1vh);
            bottom: calc(6% - 3.9vh + var(--mb-y, 0) * 1vh);
            width: calc(26.5vh + var(--mb-w, 0) * 1vh);
            height: calc(18.6vh + var(--mb-h, 0) * 1vh);
            box-sizing: border-box;
            border: 0.25vh solid rgba(200, 16, 46, 0.85);
            border-radius: 0.4vh;
            box-shadow: 0 0 1vh rgba(200, 16, 46, 0.35), inset 0 0 0 0.1vh rgba(11, 11, 13, 0.6);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #mapFrame.visible {
            opacity: 1;
        }

        #mapFrame.adjusting {
            opacity: 1;
            border-color: #d4af37;
            box-shadow: 0 0 1.4vh rgba(212, 175, 55, 0.8);
        }

        #mapFrame::before,
        #mapFrame::after {
            content: '';
            position: absolute;
            width: 1.6vh;
            height: 1.6vh;
            border-color: #d4af37;
            border-style: solid;
        }

        #mapFrame::before {
            top: -0.45vh;
            left: -0.45vh;
            border-width: 0.3vh 0 0 0.3vh;
        }

        #mapFrame::after {
            right: -0.45vh;
            bottom: -0.45vh;
            border-width: 0 0.3vh 0.3vh 0;
        }

        /* Status rings, in a row above the minimap. */
        #status {
            position: fixed;
            bottom: calc(6% - 3.9vh + 18.6vh + 1vh + (var(--mb-y, 0) + var(--mb-h, 0)) * 1vh);
            left: calc(2vh + var(--mb-x, 0) * 1vh);
            display: flex;
            align-items: center;
            gap: 0.7vh;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #status.visible {
            opacity: 1;
        }

        .ring {
            --colour: #f5f5f5;
            position: relative;
            width: 4.4vh;
            height: 4.4vh;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .ring svg.track {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .ring circle {
            fill: none;
            stroke-width: 3.2;
        }

        .ring .bg {
            fill: rgba(11, 11, 13, 0.78);
            stroke: rgba(245, 245, 245, 0.14);
        }

        .ring .value {
            stroke: var(--colour);
            stroke-linecap: round;
            filter: drop-shadow(0 0 0.25vh var(--colour));
            transition: stroke-dashoffset 0.35s ease;
        }

        .ring .icon {
            position: absolute;
            inset: 26%;
            width: 48%;
            height: 48%;
            fill: none;
            stroke: #f5f5f5;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ring .icon .solid {
            fill: #f5f5f5;
            stroke: none;
        }

        .ring.low {
            animation: low 1s ease-in-out infinite;
        }

        .ring.low .icon {
            stroke: #ff4d5e;
        }

        .ring.talking .icon {
            stroke: #d4af37;
        }

        .ring.talking .icon .solid {
            fill: #d4af37;
        }

        @keyframes low {
            50% { transform: scale(1.08); }
        }

        #status.no-map {
            bottom: 1.6vh;
        }

        /* Voice: pill with a mic and three range bars; glows gold while talking. */
        .voice {
            display: flex;
            align-items: center;
            gap: 0.5vh;
            height: 4.4vh;
            padding: 0 1.1vh 0 0.9vh;
            border: 0.2vh solid rgba(245, 245, 245, 0.18);
            border-radius: 2.2vh;
            background: rgba(11, 11, 13, 0.78);
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .voice svg {
            width: 2.1vh;
            height: 2.1vh;
            fill: none;
            stroke: #f5f5f5;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        .voice .bars {
            display: flex;
            align-items: flex-end;
            gap: 0.3vh;
            height: 1.8vh;
        }

        .voice .bars i {
            width: 0.45vh;
            border-radius: 0.2vh;
            background: rgba(245, 245, 245, 0.2);
            transition: background 0.2s ease;
        }

        .voice .bars i:nth-child(1) { height: 40%; }
        .voice .bars i:nth-child(2) { height: 70%; }
        .voice .bars i:nth-child(3) { height: 100%; }

        .voice .bars i.on {
            background: #f5f5f5;
        }

        .voice.talking {
            border-color: #d4af37;
            box-shadow: 0 0 1vh rgba(212, 175, 55, 0.55);
        }

        .voice.talking svg {
            stroke: #d4af37;
        }

        .voice.talking .bars i.on {
            background: #d4af37;
        }
    </style>
</head>
<body>
    <div id="badge">
        <div id="brand">
            <img id="icon" src="assets/icon.png" alt="">
            <div id="name">HIGHCREST <span>RP</span></div>
        </div>
        <div id="stats">
            <div class="bubble"><small>ID</small><span id="statId"></span></div>
            <div class="bubble money"><small>Cash</small><span id="statCash"></span></div>
            <div class="bubble money"><small>Bank</small><span id="statBank"></span></div>
            <div id="statJobBubble" class="bubble job" hidden><span id="statJob"></span></div>
        </div>
    </div>
    <div id="compass">
        <div id="compassBar">
            <div id="tape"></div>
            <div id="markers"></div>
            <div id="pointer"></div>
        </div>
        <div id="street" hidden><span id="streetMain"></span><small id="streetArea"></small></div>
    </div>
    <div id="mapFrame"></div>
    <div id="status"></div>
    <script>
        /* Compass: a tape of ticks from -180 to 540 degrees, slid so the heading sits under the pointer. */
        const compass = document.getElementById('compass');
        const compassBar = document.getElementById('compassBar');
        const tape = document.getElementById('tape');
        const markersEl = document.getElementById('markers');
        const LABELS = { 0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW' };
        let fieldOfView = 180;

        function buildTape() {
            const nodes = [];
            for (let deg = -180; deg <= 540; deg += 15) {
                const value = ((deg % 360) + 360) % 360;
                const left = `calc(var(--span) * ${(deg + 180) / fieldOfView})`;
                const tick = document.createElement('i');
                tick.className = deg % 45 === 0 ? 'tick major' : 'tick';
                tick.style.left = left;
                nodes.push(tick);
                if (LABELS[value]) {
                    const label = document.createElement('span');
                    label.className = LABELS[value] === 'N' ? 'heading-label north' : 'heading-label';
                    label.textContent = LABELS[value];
                    label.style.left = left;
                    nodes.push(label);
                }
            }
            tape.replaceChildren(...nodes);
        }
        buildTape();

        const distanceText = (metres) => (metres >= 1000 ? `${(metres / 1000).toFixed(1)} km` : `${metres} m`);

        function showCompass(data) {
            compass.classList.toggle('visible', data.visible);
            if (!data.visible) return;

            compassBar.hidden = !data.showBar;
            if (data.showBar) {
                if (data.fieldOfView && data.fieldOfView !== fieldOfView) {
                    fieldOfView = data.fieldOfView;
                    buildTape();
                }
                // Put (heading) at the centre: shift by (heading + 180) degrees, then back half a bar.
                tape.style.transform = `translateX(calc(var(--span) * ${0.5 - (data.heading + 180) / fieldOfView}))`;
                markersEl.replaceChildren(...(data.markers || []).map((marker) => {
                    const node = document.createElement('div');
                    node.className = 'marker';
                    node.style.left = `${50 + marker.offset * 100}%`;
                    node.style.setProperty('--colour', marker.colour);
                    node.title = marker.label;
                    const dot = document.createElement('i');
                    const label = document.createElement('span');
                    label.textContent = distanceText(marker.distance);
                    node.append(dot, label);
                    return node;
                }));
            }

            const street = data.showStreet && data.street;
            element('street').hidden = !street || !street.main;
            if (street && street.main) {
                element('streetMain').textContent = street.cross ? `${street.main} & ${street.cross}` : street.main;
                element('streetArea').textContent = street.area || '';
            }
        }

        /* Status rings. Each ring's icon is drawn on a 24x24 grid. */
        const RINGS = [
            { key: 'health', colour: '#e0203c', low: 25, icon: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>' },
            { key: 'armor', colour: '#5b8def', hideAtZero: true, icon: '<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>' },
            { key: 'hunger', colour: '#e8962f', low: 20, icon: '<path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 21V3c-2 1.5-3 4-3 7h3"/>' },
            { key: 'thirst', colour: '#37b6e8', low: 20, icon: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>' },
            { key: 'stress', colour: '#a46be0', hideAtZero: true, icon: '<path d="M3 12h4l2-5 4 10 2-5h6"/>' },
            { key: 'stamina', colour: '#d4af37', hideWhenFull: true, icon: '<path d="M13 3L6 13h5l-1 8 7-10h-5z"/>' },
            { key: 'air', colour: '#8fe3ff', low: 30, optional: true, icon: '<circle cx="9" cy="15" r="4"/><circle cx="15.5" cy="8" r="2.5"/><circle cx="17.5" cy="15.5" r="1.5"/>' },
            { key: 'engine', colour: '#3fd17a', low: 30, optional: true, icon: '<path d="M4 10h3l2-3h6v3h3v6h-3v2H9l-2-2H4z"/><path d="M2 11v4M21 11v4"/>' },
        ];
        const RING_RADIUS = 15.4;
        const RING_LENGTH = 2 * Math.PI * RING_RADIUS;
        const statusEl = document.getElementById('status');
        const mapFrame = document.getElementById('mapFrame');
        const ringNodes = {};

        // Voice: a mic with three range bars (whisper, normal, shout) that glows while talking.
        const VOICE_RANGES = ['Whisper', 'Normal', 'Shout'];
        const voiceEl = document.createElement('div');
        voiceEl.className = 'voice';
        voiceEl.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg><span class="bars"><i></i><i></i><i></i></span>`;
        statusEl.appendChild(voiceEl);
        const voiceBars = [...voiceEl.querySelectorAll('.bars i')];

        RINGS.forEach((ring) => {
            const node = document.createElement('div');
            node.className = 'ring';
            node.style.setProperty('--colour', ring.colour);
            node.innerHTML = `
                <svg class="track" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="${RING_RADIUS}"/>
                <circle class="value" cx="18" cy="18" r="${RING_RADIUS}" stroke-dasharray="${RING_LENGTH}" stroke-dashoffset="0"/></svg>
                <svg class="icon" viewBox="0 0 24 24">${ring.icon}</svg>`;
            statusEl.appendChild(node);
            ringNodes[ring.key] = { node, value: node.querySelector('.value') };
        });

        function setRing(ring, value) {
            const { node, value: arc } = ringNodes[ring.key];
            const hidden = (ring.optional && (value === undefined || value === null))
                || (ring.hideAtZero && value <= 0)
                || (ring.hideWhenFull && value >= 99);
            node.hidden = hidden;
            if (hidden) return;
            arc.setAttribute('stroke-dashoffset', RING_LENGTH * (1 - Math.max(0, Math.min(100, value)) / 100));
            node.classList.toggle('low', ring.low !== undefined && value < ring.low);
        }

        function showStatus(data) {
            statusEl.classList.toggle('visible', data.visible);
            const mapOn = data.visible && data.minimapShown;
            mapFrame.classList.toggle('visible', Boolean(mapOn));
            if (!data.visible) return;
            // Without the minimap, the row drops to the bottom corner.
            statusEl.classList.toggle('no-map', !mapOn);

            const range = Math.max(1, Math.min(3, data.voiceRange || 2));
            voiceBars.forEach((bar, index) => bar.classList.toggle('on', index < range));
            voiceEl.classList.toggle('talking', Boolean(data.talking));
            voiceEl.title = VOICE_RANGES[range - 1];

            RINGS.forEach((ring) => setRing(ring, data[ring.key]));
        }

        const badge = document.getElementById('badge');
        const element = (id) => document.getElementById(id);
        const money = (value) => `$${Number(value).toLocaleString('en-US')}`;

        function showStats(stats) {
            element('statId').textContent = stats.id;
            element('statCash').textContent = money(stats.cash);
            element('statBank').textContent = money(stats.bank);
            element('statJob').textContent = stats.job || '';
            element('statJobBubble').hidden = !stats.job;
        }

        window.addEventListener('message', ({ data }) => {
            if (!data) return;
            if (typeof data.iconVisible === 'boolean') {
                badge.classList.toggle('visible', data.iconVisible);
            }
            if (data.stats) showStats(data.stats);
            if (data.compass) showCompass(data.compass);
            if (data.status) showStatus(data.status);
            if (data.mapBorder) {
                const root = document.documentElement.style;
                root.setProperty('--mb-x', data.mapBorder.x);
                root.setProperty('--mb-y', data.mapBorder.y);
                root.setProperty('--mb-w', data.mapBorder.w);
                root.setProperty('--mb-h', data.mapBorder.h);
                mapFrame.classList.toggle('adjusting', Boolean(data.mapBorder.adjusting));
            }
        });

        // Browser preview only: index.html?preview
        if (location.search.includes('preview')) {
            badge.classList.add('visible');
            showStats({ id: 12, cash: 260, bank: 3375, job: 'LSPD - Recruit' });
            document.body.style.background = 'linear-gradient(#141420, #2a2a3a)';
            showCompass({
                visible: true, showBar: true, showStreet: true, heading: 32, fieldOfView: 180,
                markers: [
                    { offset: 0.12, colour: '#d4af37', label: 'Waypoint', distance: 840 },
                    { offset: -0.3, colour: '#4aa3ff', label: 'Friend', distance: 2300 },
                ],
                street: { main: 'Grove Street', cross: 'Forum Drive', area: 'Davis' },
            });
            showStatus({
                visible: true, minimapShown: true,
                health: 82, armor: 45, hunger: 15, thirst: 64, stress: 22, stamina: 58, air: 40,
                talking: true, voiceRange: 2,
            });
        }
    </script>
</body>
</html>
