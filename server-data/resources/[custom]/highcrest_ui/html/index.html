<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Highcrest UI</title>
    <style>
        @font-face {
            font-family: 'Rajdhani';
            src: url('assets/fonts/rajdhani-latin-500-normal.woff2') format('woff2');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Rajdhani';
            src: url('assets/fonts/rajdhani-latin-700-normal.woff2') format('woff2');
            font-weight: 700;
        }

        @font-face {
            font-family: 'Cinzel';
            src: url('assets/fonts/cinzel-latin-600-normal.woff2') format('woff2');
            font-weight: 600;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }

        /* To move the badge, change top and left. To resize it, change the icon size and font-size. */
        #badge {
            position: fixed;
            top: 1.4vh;
            right: 1.6vh;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #brand {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1vh;
        }

        #stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.6vh;
            max-width: 34vh;
            margin-block-start: 0.8vh;
            margin-inline-start: auto;
            font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
            font-size: 1.6vh;
            line-height: 1;
        }

        .bubble {
            display: flex;
            align-items: baseline;
            gap: 0.6vh;
            padding: 0.6vh 1.1vh;
            border: 0.1vh solid rgba(212, 175, 55, 0.45);
            border-radius: 2vh;
            background: rgba(11, 11, 13, 0.78);
            color: #f5f5f5;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .bubble small {
            color: #b4b4bd;
            font-size: 0.82em;
            font-weight: 500;
        }

        .bubble.money {
            color: #d4af37;
        }

        .bubble.job {
            border-color: rgba(200, 16, 46, 0.75);
        }

        [hidden] {
            display: none !important;
        }

        #badge.visible {
            opacity: 0.95;
        }

        #icon {
            width: 5.6vh;
            height: 5.6vh;
            border-radius: 50%;
            box-shadow: 0 0 1.2vh rgba(0, 0, 0, 0.6);
        }

        #name {
            color: #d4af37;
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 600;
            font-size: 2.3vh;
            letter-spacing: 0.05em;
            white-space: nowrap;
            text-shadow: 0 0.1vh 0.5vh #000, 0 0 1.2vh rgba(0, 0, 0, 0.8);
        }

        #name span {
            color: #e0203c;
        }

        /* Compass, attached to the top edge: a thin crimson line with ticks hanging from it,
           fading out at both ends. --span is the line width for its field of view. */
        #compass {
            --span: 84vh;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #compass.visible {
            opacity: 0.92;
        }

        #compassBar {
            position: relative;
            width: var(--span);
            height: 2.6vh;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
        }

        #compassBar::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 0.3vh;
            background: #c8102e;
            box-shadow: 0 0 0.8vh rgba(200, 16, 46, 0.7);
        }

        #tape {
            position: absolute;
            inset: 0;
            will-change: transform;
        }

        .tick {
            position: absolute;
            top: 0.3vh;
            width: 0.14vh;
            height: 0.4vh;
            background: rgba(245, 245, 245, 0.55);
            transform: translateX(-50%);
        }

        .tick.major {
            height: 0.75vh;
            background: rgba(245, 245, 245, 0.85);
        }

        .heading-label {
            position: absolute;
            top: 0.85vh;
            color: #f5f5f5;
            font-size: 1.6vh;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-shadow: 0 0.1vh 0.4vh rgba(0, 0, 0, 0.9);
            transform: translateX(-50%);
        }

        .heading-label.north {
            color: #e0203c;
            font-weight: 700;
        }

        #pointer {
            position: absolute;
            top: 0;
            left: 50%;
            width: 0;
            height: 0;
            border-inline: 0.65vh solid transparent;
            border-top: 0.95vh solid #f5f5f5;
            filter: drop-shadow(0 0.1vh 0.3vh rgba(0, 0, 0, 0.8));
            transform: translateX(-50%);
            z-index: 2;
        }

        /* Markers sit on the line, with their distance under them. */
        .marker {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            transform: translateX(-50%);
            z-index: 1;
        }

        .marker i {
            width: 0.9vh;
            height: 0.9vh;
            margin-top: 0.15vh;
            border-radius: 50%;
            background: var(--colour);
            box-shadow: 0 0 0.6vh var(--colour);
        }

        .marker span {
            color: var(--colour);
            font-size: 1vh;
            font-weight: 700;
            text-shadow: 0 0.1vh 0.3vh #000;
            white-space: nowrap;
        }

        #street {
            margin-top: -0.2vh;
            color: #f5f5f5;
            font-size: 1.8vh;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-align: center;
            text-shadow: 0 0.1vh 0.4vh rgba(0, 0, 0, 0.95), 0 0 1vh rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }

        #street small {
            margin-inline-start: 0.8vh;
            color: #d4af37;
            font-size: 0.85em;
        }

        #street small:not(:empty)::before {
            content: '· ';
            color: rgba(245, 245, 245, 0.6);
        }

        /* Minimap border: crimson frame with gold corner accents. Defaults were lined up in-game on a 1080p screen; players fine-tune with /hudborder. */
        #mapFrame {
            position: fixed;
            left: calc(2vh + var(--mb-x, 0) * 1vh);
            bottom: calc(6% - 0.3vh + var(--mb-y, 0) * 1vh);
            width: calc(29.7vh + var(--mb-w, 0) * 1vh);
            height: calc(18.8vh + var(--mb-h, 0) * 1vh);
            box-sizing: border-box;
            border: 0.25vh solid rgba(200, 16, 46, 0.85);
            border-radius: 0.4vh;
            box-shadow: 0 0 1vh rgba(200, 16, 46, 0.35), inset 0 0 0 0.1vh rgba(11, 11, 13, 0.6);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #mapFrame.visible {
            opacity: 1;
        }

        #mapFrame.adjusting {
            opacity: 1;
            border-color: #d4af37;
            box-shadow: 0 0 1.4vh rgba(212, 175, 55, 0.8);
        }

        #mapFrame::before,
        #mapFrame::after {
            content: '';
            position: absolute;
            width: 1.6vh;
            height: 1.6vh;
            border-color: #d4af37;
            border-style: solid;
        }

        #mapFrame::before {
            top: -0.45vh;
            left: -0.45vh;
            border-width: 0.3vh 0 0 0.3vh;
        }

        #mapFrame::after {
            right: -0.45vh;
            bottom: -0.45vh;
            border-width: 0 0.3vh 0.3vh 0;
        }

        /* Status rings, in a row above the minimap. */
        #status {
            position: fixed;
            bottom: calc(6% - 0.3vh + 18.8vh + 1vh + (var(--mb-y, 0) + var(--mb-h, 0)) * 1vh);
            left: calc(2vh + var(--mb-x, 0) * 1vh);
            display: flex;
            align-items: center;
            gap: 0.7vh;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #status.visible {
            opacity: 1;
        }

        .ring {
            --colour: #f5f5f5;
            position: relative;
            width: 4.4vh;
            height: 4.4vh;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .ring svg.track {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .ring circle {
            fill: none;
            stroke-width: 3.2;
        }

        .ring .bg {
            fill: rgba(11, 11, 13, 0.78);
            stroke: rgba(245, 245, 245, 0.14);
        }

        .ring .value {
            stroke: var(--colour);
            stroke-linecap: round;
            filter: drop-shadow(0 0 0.25vh var(--colour));
            transition: stroke-dashoffset 0.35s ease;
        }

        .ring .icon {
            position: absolute;
            inset: 26%;
            width: 48%;
            height: 48%;
            fill: none;
            stroke: #f5f5f5;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ring .icon .solid {
            fill: #f5f5f5;
            stroke: none;
        }

        .ring.low {
            animation: low 1s ease-in-out infinite;
        }

        .ring.low .icon {
            stroke: #ff4d5e;
        }

        .ring.talking .icon {
            stroke: #d4af37;
        }

        .ring.talking .icon .solid {
            fill: #d4af37;
        }

        @keyframes low {
            50% { transform: scale(1.08); }
        }

        #status.no-map {
            bottom: 1.6vh;
        }

        /* Voice: pill with a mic and three range bars; glows gold while talking. */
        .voice {
            display: flex;
            align-items: center;
            gap: 0.5vh;
            height: 4.4vh;
            padding: 0 1.1vh 0 0.9vh;
            border: 0.2vh solid rgba(245, 245, 245, 0.18);
            border-radius: 2.2vh;
            background: rgba(11, 11, 13, 0.78);
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .voice svg {
            width: 2.1vh;
            height: 2.1vh;
            fill: none;
            stroke: #f5f5f5;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        .voice .bars {
            display: flex;
            align-items: flex-end;
            gap: 0.3vh;
            height: 1.8vh;
        }

        .voice .bars i {
            width: 0.45vh;
            border-radius: 0.2vh;
            background: rgba(245, 245, 245, 0.2);
            transition: background 0.2s ease;
        }

        .voice .bars i:nth-child(1) { height: 40%; }
        .voice .bars i:nth-child(2) { height: 70%; }
        .voice .bars i:nth-child(3) { height: 100%; }

        .voice .bars i.on {
            background: #f5f5f5;
        }

        .voice.talking {
            border-color: #d4af37;
            box-shadow: 0 0 1vh rgba(212, 175, 55, 0.55);
        }

        .voice.talking svg {
            stroke: #d4af37;
        }

        .voice.talking .bars i.on {
            background: #d4af37;
        }

        /* HUD edit mode */
        #status .placed {
            position: fixed;
        }

        body.editing-hud #status [data-key] {
            pointer-events: auto;
            cursor: grab;
            outline: 0.15vh dashed rgba(212, 175, 55, 0.85);
            outline-offset: 0.3vh;
        }

        body.editing-hud #status .dragging {
            cursor: grabbing;
            outline-style: solid;
        }

        #hudEditPanel {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            padding: 1.6vh 2vh;
            border: 0.15vh solid rgba(212, 175, 55, 0.6);
            border-radius: 1vh;
            background: rgba(11, 11, 13, 0.9);
            color: #f5f5f5;
            font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
            font-size: 1.7vh;
            text-align: center;
            pointer-events: auto;
        }

        #hudEditPanel strong {
            color: #d4af37;
            font-size: 2.1vh;
            letter-spacing: 0.04em;
        }

        #hudEditPanel .buttons {
            display: flex;
            gap: 0.8vh;
        }

        #hudEditPanel button {
            padding: 0.7vh 1.6vh;
            border: 0.15vh solid rgba(245, 245, 245, 0.25);
            border-radius: 0.6vh;
            background: #1c1c22;
            color: #f5f5f5;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        #hudEditPanel button.primary {
            border-color: #c8102e;
            background: #c8102e;
        }

        /* ---------- Speedometer (bottom right) ---------- */
        #speedo {
            --crimson: #c8102e;
            --gold: #d4af37;
            position: fixed;
            right: 2.6vh;
            bottom: 2.6vh;
            width: 24vh;
            height: 24vh;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            color: #f5f5f5;
            opacity: 0;
            transform: translateY(1vh);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #speedo.visible { opacity: 1; transform: none; }
        #speedo > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
        #speedo .dial { fill: rgba(11, 11, 13, 0.62); stroke: rgba(212, 175, 55, 0.28); stroke-width: 0.6; }
        #speedo .track { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 5; stroke-linecap: round; }
        #speedo .redline { fill: none; stroke: rgba(200, 16, 46, 0.55); stroke-width: 5; stroke-linecap: butt; }
        #speedo .rpm { fill: none; stroke: url(#rpmGrad); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.08s linear; }
        #speedo .tick { stroke: rgba(255, 255, 255, 0.35); stroke-width: 0.6; }
        #speedo .centre {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding-bottom: 2vh;
        }
        #speedo .speed { font-size: 6.4vh; font-weight: 700; line-height: 0.9; letter-spacing: 0.02em; text-shadow: 0 0 1.4vh rgba(0, 0, 0, 0.6); }
        #speedo .unit { font-size: 1.3vh; font-weight: 700; letter-spacing: 0.3em; color: var(--gold); margin-top: 0.3vh; }
        #speedo .gear {
            margin-top: 0.8vh; min-width: 3vh; padding: 0.15vh 0.8vh;
            border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 0.5vh;
            font-size: 1.8vh; font-weight: 700; text-align: center;
        }
        #speedo .gear.r { color: #ff6b80; border-color: rgba(200, 16, 46, 0.7); }
        #speedo .signals { position: absolute; top: 5.2vh; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 5.4vh; }
        #speedo .sig { width: 2.2vh; height: 2.2vh; opacity: 0.18; color: #2ecc71; }
        #speedo .sig.on { animation: blink 0.75s steps(1) infinite; opacity: 1; }
        @keyframes blink { 50% { opacity: 0.18; } }
        #speedo .bottom {
            position: absolute; left: 0; right: 0; bottom: 2.2vh;
            display: flex; justify-content: center; align-items: center; gap: 0.8vh;
        }
        #speedo .meter { display: flex; align-items: center; gap: 0.5vh; font-size: 1.25vh; font-weight: 700; }
        #speedo .meter svg { position: static; width: 1.6vh; height: 1.6vh; color: var(--gold); }
        #speedo .bar { width: 3.2vh; height: 0.55vh; border-radius: 1vh; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
        #speedo .bar i { display: block; height: 100%; width: 50%; border-radius: inherit; background: linear-gradient(90deg, var(--gold), #f3d36b); transition: width 0.4s ease; }
        #speedo .bar i.low { background: linear-gradient(90deg, var(--crimson), #ff4d66); }
        #speedo .icon { width: 1.8vh; height: 1.8vh; color: rgba(255, 255, 255, 0.25); }
        #speedo .icon.on { color: #5aa9ff; }
        #speedo .icon.high { color: #9fd0ff; }
        #speedo .icon.belt-off { color: #ff4d66; animation: blink 1s steps(1) infinite; }
        #speedo .icon.belt-on { color: #2ecc71; }
        #speedo .alt { position: absolute; top: 2.6vh; left: 0; right: 0; text-align: center; font-size: 1.2vh; font-weight: 700; letter-spacing: 0.15em; color: var(--gold); }

        /* ---------- F2 vehicle menu ---------- */
        #vehmenu {
            --crimson: #c8102e;
            --gold: #d4af37;
            position: fixed;
            right: 30vh;
            top: 50%;
            transform: translateY(-50%);
            width: 54vh;
            padding: 2.2vh;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 1.2vh;
            background: linear-gradient(180deg, rgba(11, 11, 13, 0.94), rgba(28, 28, 34, 0.92));
            box-shadow: 0 2vh 5vh rgba(0, 0, 0, 0.55);
            color: #f5f5f5;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            pointer-events: auto;
            animation: vm-in 0.25s ease-out both;
        }
        #vehmenu[hidden] { display: none; }
        @keyframes vm-in { from { opacity: 0; transform: translateY(-48%); } }
        #vehmenu header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.6vh; }
        #vehmenu .vm-eyebrow { color: var(--gold); font-size: 1.1vh; letter-spacing: 0.26em; text-transform: uppercase; }
        #vehmenu h2 { margin: 0.2vh 0 0; font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 2.2vh; }
        #vehmenu .vm-close {
            width: 3.4vh; height: 3.4vh; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 0.6vh;
            background: none; color: #f5f5f5; font-size: 1.6vh; cursor: pointer;
        }
        #vehmenu .vm-close:hover { border-color: var(--gold); color: var(--gold); }
        #vehmenu h3 { margin: 1.6vh 0 0.8vh; color: var(--gold); font-size: 1.05vh; letter-spacing: 0.24em; text-transform: uppercase; }

        /* Car diagram: doors and seats around a top-down car */
        #vehmenu .car {
            display: grid;
            grid-template-columns: 1fr 21vh 1fr;
            grid-template-rows: auto 1fr 1fr auto;
            gap: 0.8vh;
            align-items: center;
        }
        #vehmenu .body {
            grid-column: 2; grid-row: 2 / 4;
            height: 20vh; border-radius: 5vh 5vh 3.5vh 3.5vh;
            border: 1px solid rgba(212, 175, 55, 0.35);
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.08), rgba(200, 16, 46, 0.06));
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0.8vh; padding: 3.2vh 1.2vh 2.4vh;
        }
        #vehmenu .vm-btn {
            display: flex; align-items: center; justify-content: center; gap: 0.6vh;
            min-height: 3.8vh; padding: 0.6vh 1vh;
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0.6vh;
            background: rgba(255, 255, 255, 0.04); color: #f5f5f5;
            font: inherit; font-size: 1.3vh; font-weight: 700; letter-spacing: 0.04em; cursor: pointer;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }
        #vehmenu .vm-btn:hover:not(:disabled) { border-color: var(--gold); }
        #vehmenu .vm-btn.on { border-color: rgba(212, 175, 55, 0.7); background: linear-gradient(90deg, rgba(92, 7, 20, 0.85), rgba(200, 16, 46, 0.45)); }
        #vehmenu .vm-btn.mine { border-color: #2ecc71; color: #2ecc71; }
        #vehmenu .vm-btn:disabled { opacity: 0.35; cursor: default; }
        #vehmenu .vm-btn svg { width: 1.7vh; height: 1.7vh; flex: none; }
        #vehmenu .seat { font-size: 1.1vh; min-height: 5vh; padding: 0.4vh; min-width: 0; }
        #vehmenu .body .seat svg { display: none; }
        #vehmenu .vm-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #vehmenu .hood { grid-column: 2; grid-row: 1; }
        #vehmenu .trunk { grid-column: 2; grid-row: 4; }
        #vehmenu .d0 { grid-column: 1; grid-row: 2; }
        #vehmenu .d1 { grid-column: 3; grid-row: 2; }
        #vehmenu .d2 { grid-column: 1; grid-row: 3; }
        #vehmenu .d3 { grid-column: 3; grid-row: 3; }
        #vehmenu .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8vh; }
        #vehmenu .row.three { grid-template-columns: repeat(3, 1fr); }
        #vehmenu .extra-seats { display: flex; flex-wrap: wrap; gap: 0.6vh; margin-top: 0.8vh; }
        #vehmenu .vm-message { min-height: 1.6vh; margin-top: 1.2vh; color: #ff8a9a; font-size: 1.25vh; }
        #vehmenu .vm-hint { margin-top: 0.4vh; color: rgba(255, 255, 255, 0.4); font-size: 1.1vh; letter-spacing: 0.08em; }
    </style>
</head>
<body>
    <div id="badge">
        <div id="brand">
            <img id="icon" src="assets/icon.png" alt="">
            <div id="name">HIGHCREST <span>RP</span></div>
        </div>
        <div id="stats">
            <div class="bubble"><small>ID</small><span id="statId"></span></div>
            <div class="bubble money"><small>Cash</small><span id="statCash"></span></div>
            <div class="bubble money"><small>Bank</small><span id="statBank"></span></div>
            <div id="statJobBubble" class="bubble job" hidden><span id="statJob"></span></div>
        </div>
    </div>
    <div id="compass">
        <div id="compassBar">
            <div id="tape"></div>
            <div id="markers"></div>
            <div id="pointer"></div>
        </div>
        <div id="street" hidden><span id="streetMain"></span><small id="streetArea"></small><small id="streetPostal"></small></div>
    </div>
    <div id="mapFrame"></div>
    <div id="status"></div>
    <div id="hudEditPanel" hidden>
        <strong>Move HUD items</strong>
        <span>Drag any icon where you want it.</span>
        <div class="buttons">
            <button id="hudEditReset" type="button">Reset</button>
            <button id="hudEditCancel" type="button">Cancel</button>
            <button id="hudEditSave" class="primary" type="button">Save</button>
        </div>
    </div>

    <!-- Speedometer -->
    <div id="speedo">
        <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
                <linearGradient id="rpmGrad" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0%" stop-color="#d4af37"/>
                    <stop offset="70%" stop-color="#f3d36b"/>
                    <stop offset="100%" stop-color="#c8102e"/>
                </linearGradient>
            </defs>
            <circle class="dial" cx="50" cy="50" r="47"/>
            <path class="track" d="M 22.4 77.6 A 39 39 0 1 1 77.6 77.6"/>
            <path class="redline" d="M 88.9 53.1 A 39 39 0 0 1 77.6 77.6"/>
            <path id="rpmArc" class="rpm" d="M 22.4 77.6 A 39 39 0 1 1 77.6 77.6"/>
            <g id="ticks"></g>
        </svg>
        <div class="alt" id="spAlt" hidden></div>
        <div class="signals">
            <svg class="sig" id="sigL" viewBox="0 0 24 24"><path fill="currentColor" d="M10 5 3 12l7 7v-4h11V9H10z"/></svg>
            <svg class="sig" id="sigR" viewBox="0 0 24 24"><path fill="currentColor" d="m14 5 7 7-7 7v-4H3V9h11z"/></svg>
        </div>
        <div class="centre">
            <div class="speed" id="spSpeed">0</div>
            <div class="unit">MPH</div>
            <div class="gear" id="spGear">N</div>
        </div>
        <div class="bottom">
            <div class="meter" id="spFuelWrap" title="Fuel">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 3h9v8h1a2 2 0 0 1 2 2v4a1 1 0 0 0 2 0V9l-2-2 1.4-1.4L20 8.2V17a3 3 0 0 1-6 0v-4h-1v8H4zm2 2v5h5V5z"/></svg>
                <div class="bar"><i id="spFuel"></i></div>
            </div>
            <svg class="icon" id="spLights" viewBox="0 0 24 24"><path fill="currentColor" d="M13 5c4 0 7 3.1 7 7s-3 7-7 7c-1.5 0-2-1.2-2-2.5v-9C11 6.2 11.5 5 13 5zM2 7h7v2H2zm0 4h7v2H2zm0 4h7v2H2z"/></svg>
            <svg class="icon" id="spBelt" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM8 8h8l1 7h-2v7h-6v-7H7zm1.2 1.6 5.6 9.6 1.4-.8-5.6-9.6z"/></svg>
            <div class="meter" id="spEngineWrap" title="Engine">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4h6v2h-2v2h4l2 2h2v2h2v-2h1v7h-1v-2h-2v2h-2l-2 2H8l-2-2H4v-2H2v4H1V9h1v4h2v-3l2-2h3V6H7z"/></svg>
                <div class="bar"><i id="spEngine"></i></div>
            </div>
        </div>
    </div>

    <!-- F2 vehicle menu -->
    <div id="vehmenu" hidden>
        <header>
            <div>
                <div class="vm-eyebrow" id="vmPlate">Vehicle</div>
                <h2 id="vmName">Vehicle</h2>
            </div>
            <button class="vm-close" data-veh="close" title="Close (F2 / Esc)">✕</button>
        </header>

        <h3>Doors &amp; seats</h3>
        <div class="car" id="vmCar"></div>
        <div class="extra-seats" id="vmExtraSeats"></div>

        <h3>Windows</h3>
        <div class="row" id="vmWindows"></div>

        <h3>Controls</h3>
        <div class="row three" id="vmControls"></div>

        <p class="vm-message" id="vmMessage"></p>
        <p class="vm-hint">Click a seat to move into it · click a door to open or close it</p>
    </div>
    <script>
        /* Compass: a tape of ticks from -180 to 540 degrees, slid so the heading sits under the pointer. */
        const compass = document.getElementById('compass');
        const compassBar = document.getElementById('compassBar');
        const tape = document.getElementById('tape');
        const markersEl = document.getElementById('markers');
        const LABELS = { 0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW' };
        let fieldOfView = 180;

        function buildTape() {
            const nodes = [];
            for (let deg = -180; deg <= 540; deg += 15) {
                const value = ((deg % 360) + 360) % 360;
                const left = `calc(var(--span) * ${(deg + 180) / fieldOfView})`;
                const tick = document.createElement('i');
                tick.className = deg % 45 === 0 ? 'tick major' : 'tick';
                tick.style.left = left;
                nodes.push(tick);
                if (LABELS[value]) {
                    const label = document.createElement('span');
                    label.className = LABELS[value] === 'N' ? 'heading-label north' : 'heading-label';
                    label.textContent = LABELS[value];
                    label.style.left = left;
                    nodes.push(label);
                }
            }
            tape.replaceChildren(...nodes);
        }
        buildTape();

        const distanceText = (metres) => (metres >= 1000 ? `${(metres / 1000).toFixed(1)} km` : `${metres} m`);

        function showCompass(data) {
            compass.classList.toggle('visible', data.visible);
            if (!data.visible) return;

            compassBar.hidden = !data.showBar;
            if (data.showBar) {
                if (data.fieldOfView && data.fieldOfView !== fieldOfView) {
                    fieldOfView = data.fieldOfView;
                    buildTape();
                }
                // Put (heading) at the centre: shift by (heading + 180) degrees, then back half a bar.
                tape.style.transform = `translateX(calc(var(--span) * ${0.5 - (data.heading + 180) / fieldOfView}))`;
                markersEl.replaceChildren(...(data.markers || []).map((marker) => {
                    const node = document.createElement('div');
                    node.className = 'marker';
                    node.style.left = `${50 + marker.offset * 100}%`;
                    node.style.setProperty('--colour', marker.colour);
                    node.title = marker.label;
                    const dot = document.createElement('i');
                    const label = document.createElement('span');
                    label.textContent = distanceText(marker.distance);
                    node.append(dot, label);
                    return node;
                }));
            }

            const street = data.showStreet && data.street;
            element('street').hidden = !street || !street.main;
            if (street && street.main) {
                element('streetMain').textContent = street.cross ? `${street.main} & ${street.cross}` : street.main;
                element('streetArea').textContent = street.area || '';
                element('streetPostal').textContent = street.postal ? `Postal ${street.postal}` : '';
            }
        }

        /* Status rings. Each ring's icon is drawn on a 24x24 grid. */
        let editingHud = false;
        const RINGS = [
            { key: 'health', colour: '#e0203c', low: 25, icon: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>' },
            { key: 'armor', colour: '#5b8def', icon: '<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>' },
            { key: 'hunger', colour: '#e8962f', low: 20, icon: '<path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 21V3c-2 1.5-3 4-3 7h3"/>' },
            { key: 'thirst', colour: '#37b6e8', low: 20, icon: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>' },
            { key: 'stress', colour: '#a46be0', hideAtZero: true, icon: '<path d="M3 12h4l2-5 4 10 2-5h6"/>' },
            { key: 'stamina', colour: '#d4af37', hideWhenFull: true, icon: '<path d="M13 3L6 13h5l-1 8 7-10h-5z"/>' },
            { key: 'air', colour: '#8fe3ff', low: 30, optional: true, icon: '<circle cx="9" cy="15" r="4"/><circle cx="15.5" cy="8" r="2.5"/><circle cx="17.5" cy="15.5" r="1.5"/>' },
            { key: 'engine', colour: '#3fd17a', low: 30, optional: true, icon: '<path d="M4 10h3l2-3h6v3h3v6h-3v2H9l-2-2H4z"/><path d="M2 11v4M21 11v4"/>' },
        ];
        const RING_RADIUS = 15.4;
        const RING_LENGTH = 2 * Math.PI * RING_RADIUS;
        const statusEl = document.getElementById('status');
        const mapFrame = document.getElementById('mapFrame');
        const ringNodes = {};

        // Voice: a mic with three range bars (whisper, normal, shout) that glows while talking.
        const VOICE_RANGES = ['Whisper', 'Normal', 'Shout'];
        const voiceEl = document.createElement('div');
        voiceEl.className = 'voice';
        voiceEl.dataset.key = 'voice';
        voiceEl.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg><span class="bars"><i></i><i></i><i></i></span>`;
        statusEl.appendChild(voiceEl);
        const voiceBars = [...voiceEl.querySelectorAll('.bars i')];

        RINGS.forEach((ring) => {
            const node = document.createElement('div');
            node.className = 'ring';
            node.dataset.key = ring.key;
            node.style.setProperty('--colour', ring.colour);
            node.innerHTML = `
                <svg class="track" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="${RING_RADIUS}"/>
                <circle class="value" cx="18" cy="18" r="${RING_RADIUS}" stroke-dasharray="${RING_LENGTH}" stroke-dashoffset="0"/></svg>
                <svg class="icon" viewBox="0 0 24 24">${ring.icon}</svg>`;
            statusEl.appendChild(node);
            ringNodes[ring.key] = { node, value: node.querySelector('.value') };
        });

        function setRing(ring, value) {
            const { node, value: arc } = ringNodes[ring.key];
            // In edit mode every ring shows, so players can place the ones that only appear sometimes.
            if (editingHud && (value === undefined || value === null)) value = 100;
            const hidden = !editingHud && ((ring.optional && (value === undefined || value === null))
                || (ring.hideAtZero && value <= 0)
                || (ring.hideWhenFull && value >= 99));
            node.hidden = hidden;
            if (hidden) return;
            arc.setAttribute('stroke-dashoffset', RING_LENGTH * (1 - Math.max(0, Math.min(100, value)) / 100));
            node.classList.toggle('low', ring.low !== undefined && value < ring.low);
        }

        function showStatus(data) {
            statusEl.classList.toggle('visible', data.visible);
            const mapOn = data.visible && data.minimapShown;
            mapFrame.classList.toggle('visible', Boolean(mapOn));
            if (!data.visible) return;
            // Without the minimap, the row drops to the bottom corner.
            statusEl.classList.toggle('no-map', !mapOn);

            const range = Math.max(1, Math.min(3, data.voiceRange || 2));
            voiceBars.forEach((bar, index) => bar.classList.toggle('on', index < range));
            voiceEl.classList.toggle('talking', Boolean(data.talking));
            voiceEl.title = VOICE_RANGES[range - 1];

            RINGS.forEach((ring) => setRing(ring, data[ring.key]));
        }

        /* HUD edit mode: drag any status item where you want it. Positions are fractions of the
           screen, saved per player by the game. Items without a saved spot stay in the row. */
        let hudLayout = {};

        function hudItems() {
            return [...statusEl.querySelectorAll('[data-key]')];
        }

        function applyLayout() {
            hudItems().forEach((item) => {
                const spot = hudLayout[item.dataset.key];
                item.classList.toggle('placed', Boolean(spot));
                item.style.left = spot ? `${spot.x * 100}vw` : '';
                item.style.top = spot ? `${spot.y * 100}vh` : '';
            });
        }

        function setEditing(on) {
            editingHud = on;
            document.body.classList.toggle('editing-hud', on);
            document.getElementById('hudEditPanel').hidden = !on;
            if (on) statusEl.classList.add('visible');
        }

        let dragging = null;
        statusEl.addEventListener('mousedown', (event) => {
            if (!editingHud) return;
            const item = event.target.closest('[data-key]');
            if (!item) return;
            const rect = item.getBoundingClientRect();
            dragging = { item, dx: event.clientX - rect.left, dy: event.clientY - rect.top };
            item.classList.add('placed', 'dragging');
            event.preventDefault();
        });
        window.addEventListener('mousemove', (event) => {
            if (!dragging) return;
            const x = Math.max(0, Math.min(window.innerWidth - 20, event.clientX - dragging.dx)) / window.innerWidth;
            const y = Math.max(0, Math.min(window.innerHeight - 20, event.clientY - dragging.dy)) / window.innerHeight;
            hudLayout[dragging.item.dataset.key] = { x, y };
            dragging.item.style.left = `${x * 100}vw`;
            dragging.item.style.top = `${y * 100}vh`;
        });
        window.addEventListener('mouseup', () => {
            if (dragging) dragging.item.classList.remove('dragging');
            dragging = null;
        });

        const nui = (name, body) => fetch(`https://${GetParentResourceName()}/${name}`, { method: 'POST', body: JSON.stringify(body || {}) }).catch(() => {});
        let layoutBeforeEdit = {};

        document.getElementById('hudEditSave').addEventListener('click', () => {
            setEditing(false);
            nui('saveLayout', hudLayout);
        });
        document.getElementById('hudEditReset').addEventListener('click', () => {
            hudLayout = {};
            applyLayout();
        });
        window.addEventListener('keydown', (event) => {
            if (editingHud && event.key === 'Escape') document.getElementById('hudEditCancel').click();
        });
        document.getElementById('hudEditCancel').addEventListener('click', () => {
            hudLayout = layoutBeforeEdit;
            applyLayout();
            setEditing(false);
            nui('cancelEdit');
        });

        const badge = document.getElementById('badge');
        const element = (id) => document.getElementById(id);
        const money = (value) => `$${Number(value).toLocaleString('en-US')}`;

        function showStats(stats) {
            element('statId').textContent = stats.id;
            element('statCash').textContent = money(stats.cash);
            element('statBank').textContent = money(stats.bank);
            element('statJob').textContent = stats.job || '';
            element('statJobBubble').hidden = !stats.job;
        }

        window.addEventListener('message', ({ data }) => {
            if (!data) return;
            if (typeof data.iconVisible === 'boolean') {
                badge.classList.toggle('visible', data.iconVisible);
            }
            if (data.stats) showStats(data.stats);
            if (data.compass) showCompass(data.compass);
            if (data.status) showStatus(data.status);
            if (data.speedo) showSpeedo(data.speedo);
            if (data.vehmenu) showVehMenu(data.vehmenu);
            if (data.hudLayout) {
                hudLayout = Array.isArray(data.hudLayout) ? {} : data.hudLayout;
                applyLayout();
            }
            if (data.editHud) {
                layoutBeforeEdit = { ...hudLayout };
                setEditing(true);
            }
            if (data.mapBorder) {
                const root = document.documentElement.style;
                root.setProperty('--mb-x', data.mapBorder.x);
                root.setProperty('--mb-y', data.mapBorder.y);
                root.setProperty('--mb-w', data.mapBorder.w);
                root.setProperty('--mb-h', data.mapBorder.h);
                mapFrame.classList.toggle('adjusting', Boolean(data.mapBorder.adjusting));
            }
        });


        /* ---------- Speedometer ---------- */
        const speedoEl = element('speedo');
        const rpmArc = element('rpmArc');
        const RPM_LEN = 2 * Math.PI * 39 * 0.75;
        rpmArc.style.strokeDasharray = `${RPM_LEN}`;
        rpmArc.style.strokeDashoffset = `${RPM_LEN}`;
        (() => {
            // 11 ticks around the 270° dial (starts bottom-left, ends bottom-right).
            const g = element('ticks');
            for (let i = 0; i <= 10; i++) {
                const angle = (135 + i * 27) * Math.PI / 180;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('class', 'tick');
                line.setAttribute('x1', 50 + Math.cos(angle) * 33.5);
                line.setAttribute('y1', 50 + Math.sin(angle) * 33.5);
                line.setAttribute('x2', 50 + Math.cos(angle) * (i % 5 === 0 ? 30 : 31.5));
                line.setAttribute('y2', 50 + Math.sin(angle) * (i % 5 === 0 ? 30 : 31.5));
                g.appendChild(line);
            }
        })();

        function showSpeedo(d) {
            speedoEl.classList.toggle('visible', !!d.visible);
            if (!d.visible) return;
            element('spSpeed').textContent = d.speed ?? 0;
            const rpm = Math.max(0, Math.min(1, ((d.rpm || 0) - 0.2) / 0.8));
            rpmArc.style.strokeDashoffset = `${RPM_LEN * (1 - (d.engineOn === false ? 0 : rpm))}`;
            const gear = element('spGear');
            gear.textContent = d.gear || '';
            gear.hidden = !d.gear;
            gear.classList.toggle('r', d.gear === 'R');

            element('spFuelWrap').hidden = d.fuel == null;
            if (d.fuel != null) {
                const fuel = element('spFuel');
                fuel.style.width = `${Math.max(2, Math.min(100, d.fuel))}%`;
                fuel.classList.toggle('low', d.fuel <= 20);
            }
            element('spEngineWrap').hidden = d.engine == null;
            if (d.engine != null) {
                const engine = element('spEngine');
                engine.style.width = `${Math.max(2, Math.min(100, d.engine))}%`;
                engine.classList.toggle('low', d.engine <= 35);
            }

            const lights = element('spLights');
            lights.classList.toggle('on', d.lights === 1);
            lights.classList.toggle('high', d.lights === 2);
            const belt = element('spBelt');
            belt.style.display = d.beltNeeded ? '' : 'none';
            belt.classList.toggle('belt-on', d.belt === true);
            belt.classList.toggle('belt-off', d.beltNeeded && d.belt !== true && (d.speed || 0) > 10);
            element('sigL').classList.toggle('on', !!d.left);
            element('sigR').classList.toggle('on', !!d.right);
            const alt = element('spAlt');
            alt.hidden = d.altitude == null;
            if (d.altitude != null) alt.textContent = `ALT ${d.altitude} FT`;
        }

        /* ---------- F2 vehicle menu ---------- */
        const vehMenu = element('vehmenu');
        const DOOR_NAMES = { 0: 'Front left', 1: 'Front right', 2: 'Rear left', 3: 'Rear right', 4: 'Hood', 5: 'Trunk' };
        const ICON_DOOR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 3h11l4 5v13H5zm2 2v5h11.2L15 5zm7 9v2h3v-2z"/></svg>';
        const ICON_SEAT = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h5l1 9h5a2 2 0 0 1 2 2v6h-2v-4H8a2 2 0 0 1-2-2z"/></svg>';
        let vehState = null;

        const vmButton = (label, cls, on, onClick, opts = {}) => {
            const b = document.createElement('button');
            b.className = `vm-btn ${cls || ''}${on ? ' on' : ''}${opts.mine ? ' mine' : ''}`;
            b.innerHTML = (opts.icon || '') + `<span>${label}</span>`;
            b.disabled = !!opts.disabled;
            b.addEventListener('click', onClick);
            return b;
        };

        async function vehAction(body) {
            const res = await fetch(`https://${GetParentResourceName()}/vehAction`, { method: 'POST', body: JSON.stringify(body) })
                .then((r) => r.json()).catch(() => null);
            element('vmMessage').textContent = (res && res.message) || '';
            if (res && res.state) renderVehMenu(res.state);
        }

        function renderVehMenu(s) {
            vehState = s;
            element('vmName').textContent = s.name || 'Vehicle';
            element('vmPlate').textContent = s.plate ? `Plate ${s.plate.trim()}` : 'Vehicle';

            // Car diagram: doors around the body, the four main seats inside it.
            const car = element('vmCar');
            car.textContent = '';
            const doorOf = Object.fromEntries((s.doors || []).map((d) => [d.door, d]));
            const doorBtn = (door, cls) => {
                const d = doorOf[door];
                return vmButton(DOOR_NAMES[door], cls, d && d.open, () => vehAction({ action: 'door', door }),
                    { icon: ICON_DOOR, disabled: !d });
            };
            car.append(doorBtn(4, 'hood'), doorBtn(0, 'd0'), doorBtn(1, 'd1'), doorBtn(2, 'd2'), doorBtn(3, 'd3'), doorBtn(5, 'trunk'));
            const body = document.createElement('div');
            body.className = 'body';
            const seatOf = Object.fromEntries((s.seats || []).map((x) => [x.seat, x]));
            [-1, 0, 1, 2].forEach((seat) => {
                const x = seatOf[seat];
                body.appendChild(vmButton(x ? x.name : '—', 'seat', false, () => vehAction({ action: 'seat', seat }),
                    { icon: ICON_SEAT, mine: x && x.mine, disabled: !x || x.taken || x.mine || !s.inside }));
            });
            car.appendChild(body);

            const extra = element('vmExtraSeats');
            extra.textContent = '';
            (s.seats || []).filter((x) => x.seat > 2).forEach((x) => {
                extra.appendChild(vmButton(x.name, 'seat', false, () => vehAction({ action: 'seat', seat: x.seat }),
                    { icon: ICON_SEAT, mine: x.mine, disabled: x.taken || x.mine || !s.inside }));
            });

            const windows = element('vmWindows');
            windows.textContent = '';
            ['Front left', 'Front right', 'Rear left', 'Rear right'].forEach((label, i) => {
                const w = (s.windows || [])[i];
                windows.appendChild(vmButton(label, '', w && w.down, () => vehAction({ action: 'window', window: i })));
            });

            const controls = element('vmControls');
            controls.textContent = '';
            const driverOnly = { disabled: !s.driver };
            controls.append(
                vmButton(s.engine ? 'Engine on' : 'Engine off', '', s.engine, () => vehAction({ action: 'engine' }), driverOnly),
                vmButton(s.lights ? 'Lights on' : 'Lights off', '', s.lights, () => vehAction({ action: 'lights' }), driverOnly),
                vmButton('Interior light', '', s.interior, () => vehAction({ action: 'interior' }), { disabled: !s.inside }),
                vmButton('⇦ Left', '', s.signals === 1, () => vehAction({ action: 'left' }), driverOnly),
                vmButton('Hazards', '', s.signals === 3, () => vehAction({ action: 'hazards' }), driverOnly),
                vmButton('Right ⇨', '', s.signals === 2, () => vehAction({ action: 'right' }), driverOnly),
            );
            controls.appendChild(vmButton(!s.neon ? 'No underglow' : (s.neonOn ? 'Underglow on' : 'Underglow off'), '', s.neonOn,
                () => vehAction({ action: 'neon' }), { disabled: !s.driver || !s.neon }));
        }

        function showVehMenu(d) {
            vehMenu.hidden = !d.open;
            element('vmMessage').textContent = '';
            if (d.open && d.state) renderVehMenu(d.state);
        }

        vehMenu.addEventListener('click', (e) => {
            if (e.target.closest('[data-veh="close"]')) nui('vehClose');
        });
        document.addEventListener('keydown', (e) => {
            if (vehMenu.hidden) return;
            if (e.key === 'Escape' || e.key === 'F2') { e.preventDefault(); nui('vehClose'); }
        });

        // Browser preview only: index.html?preview
        if (location.search.includes('preview')) {
            badge.classList.add('visible');
            showStats({ id: 12, cash: 260, bank: 3375, job: 'LSPD - Recruit' });
            document.body.style.background = 'linear-gradient(#141420, #2a2a3a)';
            showCompass({
                visible: true, showBar: true, showStreet: true, heading: 32, fieldOfView: 180,
                markers: [
                    { offset: 0.12, colour: '#d4af37', label: 'Waypoint', distance: 840 },
                    { offset: -0.3, colour: '#4aa3ff', label: 'Friend', distance: 2300 },
                ],
                street: { main: 'Grove Street', cross: 'Forum Drive', area: 'Davis', postal: '8031' },
            });
            showStatus({
                visible: true, minimapShown: true,
                health: 82, armor: 45, hunger: 15, thirst: 64, stress: 22, stamina: 58, air: 40,
                talking: true, voiceRange: 2,
            });
            if (location.search.includes('vehicle')) {
                showSpeedo({ visible: true, speed: 87, rpm: 0.78, gear: '4', fuel: 62, engine: 91, belt: false, beltNeeded: true, lights: 1, left: true, right: false, engineOn: true });
