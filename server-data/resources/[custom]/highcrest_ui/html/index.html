<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Highcrest UI</title>
    <style>
        @font-face {
            font-family: 'Cinzel';
            src: url('assets/fonts/cinzel-latin-600-normal.woff2') format('woff2');
            font-weight: 600;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }

        /* To move the badge, change top and left. To resize it, change the icon size and font-size. */
        #badge {
            position: fixed;
            top: 1.4vh;
            left: 1.6vh;
            display: flex;
            align-items: center;
            gap: 1vh;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #badge.visible {
            opacity: 0.95;
        }

        #icon {
            width: 5.6vh;
            height: 5.6vh;
            border-radius: 50%;
            box-shadow: 0 0 1.2vh rgba(0, 0, 0, 0.6);
        }

        #name {
            color: #d4af37;
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 600;
            font-size: 2.3vh;
            letter-spacing: 0.05em;
            white-space: nowrap;
            text-shadow: 0 0.1vh 0.5vh #000, 0 0 1.2vh rgba(0, 0, 0, 0.8);
        }

        #name span {
            color: #e0203c;
        }
    </style>
</head>
<body>
    <div id="badge">
        <img id="icon" src="assets/icon.png" alt="">
        <div id="name">HIGHCREST <span>RP</span></div>
    </div>
    <script>
        const badge = document.getElementById('badge');

        window.addEventListener('message', ({ data }) => {
            if (data && typeof data.iconVisible === 'boolean') {
                badge.classList.toggle('visible', data.iconVisible);
            }
        });

        // Browser preview only: index.html?preview
        if (location.search.includes('preview')) {
            badge.classList.add('visible');
        }
    </script>
</body>
</html>
