<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Highcrest UI</title>
    <style>
        @font-face {
            font-family: 'Rajdhani';
            src: url('assets/fonts/rajdhani-latin-500-normal.woff2') format('woff2');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Rajdhani';
            src: url('assets/fonts/rajdhani-latin-700-normal.woff2') format('woff2');
            font-weight: 700;
        }

        @font-face {
            font-family: 'Cinzel';
            src: url('assets/fonts/cinzel-latin-600-normal.woff2') format('woff2');
            font-weight: 600;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }

        /* To move the badge, change top and left. To resize it, change the icon size and font-size. */
        #badge {
            position: fixed;
            top: 1.4vh;
            right: 1.6vh;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #brand {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1vh;
        }

        #stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.6vh;
            max-width: 34vh;
            margin-block-start: 0.8vh;
            margin-inline-start: auto;
            font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
            font-size: 1.6vh;
            line-height: 1;
        }

        .bubble {
            display: flex;
            align-items: baseline;
            gap: 0.6vh;
            padding: 0.6vh 1.1vh;
            border: 0.1vh solid rgba(212, 175, 55, 0.45);
            border-radius: 2vh;
            background: rgba(11, 11, 13, 0.78);
            color: #f5f5f5;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .bubble small {
            color: #b4b4bd;
            font-size: 0.82em;
            font-weight: 500;
        }

        .bubble.money {
            color: #d4af37;
        }

        .bubble.job {
            border-color: rgba(200, 16, 46, 0.75);
        }

        [hidden] {
            display: none !important;
        }

        #badge.visible {
            opacity: 0.95;
        }

        #icon {
            width: 5.6vh;
            height: 5.6vh;
            border-radius: 50%;
            box-shadow: 0 0 1.2vh rgba(0, 0, 0, 0.6);
        }

        #name {
            color: #d4af37;
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 600;
            font-size: 2.3vh;
            letter-spacing: 0.05em;
            white-space: nowrap;
            text-shadow: 0 0.1vh 0.5vh #000, 0 0 1.2vh rgba(0, 0, 0, 0.8);
        }

        #name span {
            color: #e0203c;
        }
    </style>
</head>
<body>
    <div id="badge">
        <div id="brand">
            <img id="icon" src="assets/icon.png" alt="">
            <div id="name">HIGHCREST <span>RP</span></div>
        </div>
        <div id="stats">
            <div class="bubble"><small>ID</small><span id="statId"></span></div>
            <div class="bubble money"><small>Cash</small><span id="statCash"></span></div>
            <div class="bubble money"><small>Bank</small><span id="statBank"></span></div>
            <div id="statJobBubble" class="bubble job" hidden><span id="statJob"></span></div>
        </div>
    </div>
    <script>
        const badge = document.getElementById('badge');
        const element = (id) => document.getElementById(id);
        const money = (value) => `$${Number(value).toLocaleString('en-US')}`;

        function showStats(stats) {
            element('statId').textContent = stats.id;
            element('statCash').textContent = money(stats.cash);
            element('statBank').textContent = money(stats.bank);
            element('statJob').textContent = stats.job || '';
            element('statJobBubble').hidden = !stats.job;
        }

        window.addEventListener('message', ({ data }) => {
            if (!data) return;
            if (typeof data.iconVisible === 'boolean') {
                badge.classList.toggle('visible', data.iconVisible);
            }
            if (data.stats) showStats(data.stats);
        });

        // Browser preview only: index.html?preview
        if (location.search.includes('preview')) {
            badge.classList.add('visible');
            showStats({ id: 12, cash: 260, bank: 3375, job: 'LSPD - Recruit' });
        }
    </script>
</body>
</html>
