<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Highcrest Phone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="phone" class="phone" hidden>
        <div id="screen" class="screen">
            <div class="statusbar"><span id="clock">12:00</span><span class="brand">HIGHCREST</span></div>
            <button id="callStrip" class="call-strip" hidden>On a call. Tap to return.</button>

            <section id="home" class="view">
                <div class="home-clock" id="homeClock">12:00</div>
                <div class="apps">
                    <button class="app" data-open="phone">
                        <span class="app-icon"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4.5-2 1.5a12 12 0 0 0 5.5 5.5l1.5-2 4.5 1.5v3a2 2 0 0 1-2 2A15.5 15.5 0 0 1 4.500 5.500a2 2 0 0 1 2-2z"/></svg></span>
                        Phone
                    </button>
                    <button class="app" data-open="messages">
                        <span class="app-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4v-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg><b id="messagesBadge" class="badge app-badge" hidden>0</b></span>
                        Messages
                    </button>
                    <button class="app" data-open="contacts">
                        <span class="app-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
                        Contacts
                    </button>
                    <button class="app" data-open="camera">
                        <span class="app-icon"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
                        Camera
                    </button>
                    <button class="app" data-open="gallery">
                        <span class="app-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5 4.5 4"/></svg></span>
                        Gallery
                    </button>
                    <button class="app" data-open="settings">
                        <span class="app-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/></svg></span>
                        Settings
                    </button>
                </div>
            </section>

            <section id="gallery" class="view page" hidden>
                <h2>Gallery <small id="photoCount"></small></h2>
                <div id="photoGrid" class="photo-grid"></div>
                <p id="galleryEmpty" class="empty" hidden>No photos yet. Open the Camera to take one.</p>
            </section>

            <section id="viewer" class="view page" hidden>
                <img id="viewerImage" class="viewer-image" alt="">
                <p id="viewerDate" class="muted"></p>
                <button id="setWallpaper" class="button accent">Set as wallpaper</button>
                <button id="deletePhoto" class="button">Delete</button>
            </section>

            <section id="settings" class="view page" hidden>
                <h2>Settings</h2>
                <p class="muted">Your number: <span id="phoneNumber"></span></p>

                <h3>Phone color</h3>
                <div id="caseSwatches" class="swatches"></div>
                <label class="custom">Custom <input id="caseCustom" type="color"></label>

                <h3>Accent color</h3>
                <div id="accentSwatches" class="swatches"></div>
                <label class="custom">Custom <input id="accentCustom" type="color"></label>

                <h3>Wallpaper</h3>
                <div id="wallpapers" class="wallpapers"></div>
                <p class="muted">To use your own photo, open it in the Gallery.</p>
            </section>

            <section id="dialer" class="view page" hidden>
                <h2>Phone</h2>
                <input id="dialNumber" class="field dial-number" inputmode="numeric" maxlength="15" placeholder="Enter a number">
                <p id="dialError" class="error"></p>
                <div class="keypad">
                    <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
                    <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
                    <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
                    <button id="dialClear" aria-label="Delete">&#9003;</button><button data-digit="0">0</button><button id="dialCall" class="key-call">Call</button>
                </div>
            </section>

            <section id="call" class="view page call-view" hidden>
                <p id="callState" class="muted"></p>
                <h2 id="callName"></h2>
                <div class="call-actions">
                    <button id="callAnswer" class="button accent">Answer</button>
                    <button id="callHangUp" class="button danger">Hang up</button>
                </div>
            </section>

            <section id="contacts" class="view page" hidden>
                <h2>Contacts</h2>
                <button id="contactAdd" class="button accent">Add contact</button>
                <div id="contactList" class="rows"></div>
                <p id="contactsEmpty" class="empty" hidden>No contacts yet.</p>
            </section>

            <section id="contact" class="view page" hidden>
                <h2>Contact</h2>
                <label class="field-label">Name <input id="contactName" class="field" maxlength="40"></label>
                <label class="field-label">Number <input id="contactNumber" class="field" maxlength="15"></label>
                <p id="contactError" class="error"></p>
                <button id="contactSave" class="button accent">Save</button>
                <div id="contactActions">
                    <button id="contactCall" class="button">Call</button>
                    <button id="contactMessage" class="button">Message</button>
                    <button id="contactDelete" class="button">Delete</button>
                </div>
            </section>

            <section id="messages" class="view page" hidden>
                <h2>Messages</h2>
                <div class="compose">
                    <input id="newMessageNumber" class="field" maxlength="15" placeholder="Number">
                    <button id="newMessageGo" class="button accent">New</button>
                </div>
                <p id="newMessageError" class="error"></p>
                <div id="conversationList" class="rows"></div>
                <p id="messagesEmpty" class="empty" hidden>No messages yet.</p>
            </section>

            <section id="conversation" class="view page conversation" hidden>
                <h2 id="conversationName"></h2>
                <div id="bubbles" class="bubbles"></div>
                <p id="messageError" class="error"></p>
                <div class="compose">
                    <input id="messageInput" class="field" maxlength="500" placeholder="Message">
                    <button id="messageSend" class="button accent">Send</button>
                </div>
            </section>

            <button id="homeBar" class="home-bar" aria-label="Home"></button>
        </div>
    </div>

    <div id="cameraHud" class="camera-hud" hidden>
        <p id="cameraMessage" class="camera-message"></p>
        <p class="camera-keys"><kbd>Enter</kbd> Take photo <kbd>Backspace</kbd> Back to phone</p>
    </div>
    <div id="flash" class="flash"></div>

    <script src="app.js"></script>
    <script src="comms.js"></script>
</body>
</html>
