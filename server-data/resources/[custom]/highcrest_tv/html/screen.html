<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- YouTube embeds need a referrer, or they refuse to play (error 153). -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Highcrest TV</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #youtube, #video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #video {
            object-fit: contain;
            background: #000;
        }

        /* Shown while a video loads, or if it can't play. */
        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 8%;
            color: #d4af37;
            font: 700 48px 'Segoe UI', Arial, sans-serif;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
            background: radial-gradient(ellipse at center, #3a0610, #000 70%);
        }


        /* Emergency broadcast (tsunami): covers the whole screen. */
        #eas {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            background: #0b0b0d; color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #eas .eas-bar { padding: 22px 40px; background: repeating-linear-gradient(45deg, #c8102e 0 40px, #8a0b20 40px 80px); font: 800 54px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; }
        #eas .eas-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 80px; text-align: center; }
        #eas h1 { margin: 0; font-size: 92px; color: #ffcf33; text-transform: uppercase; letter-spacing: 0.06em; animation: eas-blink 1.2s steps(1) infinite; }
        #eas p { margin: 0; font-size: 40px; line-height: 1.35; max-width: 1050px; }
        #eas .eas-count { font-size: 64px; font-weight: 800; color: #ff4d66; }
        #eas .eas-ticker { overflow: hidden; white-space: nowrap; background: #ffcf33; color: #0b0b0d; font: 800 34px 'Segoe UI', Arial, sans-serif; padding: 14px 0; }
        #eas .eas-ticker span { display: inline-block; padding-left: 100%; animation: eas-scroll 26s linear infinite; }
        @keyframes eas-blink { 50% { opacity: 0.35; } }
        @keyframes eas-scroll { to { transform: translateX(-100%); } }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div id="youtube" hidden></div>
    <video id="video" playsinline hidden></video>
    <div id="status">Highcrest TV</div>
    <div id="eas" hidden>
        <div class="eas-bar">Emergency Alert System</div>
        <div class="eas-main">
            <h1 id="easHead">Tsunami Warning</h1>
            <p id="easBody"></p>
            <div class="eas-count" id="easCount"></div>
        </div>
        <div class="eas-ticker"><span id="easTicker"></span></div>
    </div>

    <script>
        'use strict';

        const statusEl = document.getElementById('status');
        const videoEl = document.getElementById('video');
        let ytPlayer = null;
        let ytReady = false;
        let pending = null;
        let volume = 0;

        function showStatus(text) {
            statusEl.textContent = text;
            statusEl.hidden = !text;
        }

        function clearPlayers() {
            if (ytPlayer) { ytPlayer.destroy(); ytPlayer = null; }
            const holder = document.getElementById('youtube');
            holder.hidden = true;
            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.load();
            videoEl.hidden = true;
        }

        function playYouTube(id, start) {
            if (!ytReady) { pending = { kind: 'youtube', id, start }; return; }
            const holder = document.createElement('div');
            holder.id = 'youtube';
            document.getElementById('youtube').replaceWith(holder);
            ytPlayer = new YT.Player('youtube', {
                width: '100%',
                height: '100%',
                videoId: id,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    disablekb: 1,
                    rel: 0,
                    playsinline: 1,
                    start: Math.floor(start),
                    origin: window.location.origin,
                },
                events: {
                    onReady: (e) => {
                        e.target.setVolume(volume);
                        e.target.playVideo();
                        showStatus('');
                    },
                    onError: (e) => showStatus(`This video can't play on TV (YouTube error ${e.data})`),
                },
            });
        }

        function playVideo(url, start) {
            videoEl.hidden = false;
            videoEl.src = url;
            videoEl.volume = volume / 100;
            videoEl.addEventListener('loadedmetadata', () => {
                if (start && videoEl.duration && start < videoEl.duration) videoEl.currentTime = start;
                videoEl.play().catch(() => {});
            }, { once: true });
            videoEl.onplaying = () => showStatus('');
            videoEl.onerror = () => showStatus("This video can't play on TV");
        }

        function play(media, start) {
            clearPlayers();
            showStatus('Loading…');
            if (media.kind === 'youtube') playYouTube(media.id, start);
            else if (media.kind === 'video') playVideo(media.url, start);
        }

        function setVolume(v) {
            volume = Math.max(0, Math.min(100, Number(v) || 0));
            if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(volume);
            videoEl.volume = volume / 100;
        }

        window.onYouTubeIframeAPIReady = () => {
            ytReady = true;
            if (pending) { const p = pending; pending = null; playYouTube(p.id, p.start); }
        };


        // Emergency broadcast: shown over everything, with a soft alert tone that follows the TV volume.
        const easEl = document.getElementById('eas');
        let easTimer = null, easTone = null, easEnds = 0;
        function easBeep() {
            try {
                const ctx = easTone || (easTone = new AudioContext());
                const gain = ctx.createGain();
                gain.gain.value = 0.04 * (volume / 100);
                gain.connect(ctx.destination);
                [853, 960].forEach((f) => {
                    const o = ctx.createOscillator();
                    o.frequency.value = f; o.connect(gain); o.start(); o.stop(ctx.currentTime + 0.9);
                });
            } catch { /* no audio */ }
        }
        function showEmergency(text, seconds) {
            text = text || {};
            document.getElementById('easHead').textContent = text.headline || 'Emergency Alert';
            document.getElementById('easBody').textContent = text.body || '';
            document.getElementById('easTicker').textContent = (text.ticker || '').repeat(3);
            easEnds = Date.now() + (Number(seconds) || 120) * 1000;
            easEl.hidden = false;
            clearInterval(easTimer);
            let ticks = 0;
            const tick = () => {
                const left = Math.max(0, Math.ceil((easEnds - Date.now()) / 1000));
                document.getElementById('easCount').textContent = `Evacuation in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
                if (ticks++ % 8 === 0) easBeep();
            };
            tick();
            easTimer = setInterval(tick, 1000);
        }
        function endEmergency() {
            clearInterval(easTimer);
            easEl.hidden = true;
        }

        window.addEventListener('message', (event) => {
            let data = event.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch { return; }
            }
            if (!data || typeof data !== 'object') return;
            if (data.action === 'play' && data.media) {
                volume = Number(data.volume) || 0;
                play(data.media, Number(data.start) || 0);
            } else if (data.action === 'emergency') {
                showEmergency(data.text, data.seconds);
            } else if (data.action === 'emergencyEnd') {
                endEmergency();
            } else if (data.action === 'volume') {
                setVolume(data.volume);
            }
        });
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
