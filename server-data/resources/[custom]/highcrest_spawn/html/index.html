<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Highcrest Spawn</title>
    <style>
        @font-face { font-family: 'Rajdhani'; src: url('fonts/rajdhani-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
        @font-face { font-family: 'Rajdhani'; src: url('fonts/rajdhani-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
        @font-face { font-family: 'Cinzel'; src: url('fonts/cinzel-latin-600-normal.woff2') format('woff2'); font-weight: 600; }

        :root {
            --crimson: #c8102e;
            --gold: #d4af37;
            --white: #f5f5f5;
            --muted: #a9a9b2;
            --black: #0b0b0d;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
            color: var(--white);
            user-select: none;
        }

        #picker {
            position: fixed;
            inset: 0 auto 0 0;
            width: 46vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2vh;
            padding: 0 4vh;
            background: linear-gradient(90deg, rgba(11, 11, 13, 0.92) 0%, rgba(11, 11, 13, 0.75) 70%, transparent 100%);
            opacity: 0;
            transform: translateX(-3vh);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        #picker.open {
            opacity: 1;
            transform: none;
        }

        .brand {
            color: var(--gold);
            font-family: 'Cinzel', Georgia, serif;
            font-size: 2vh;
            letter-spacing: 0.3em;
        }

        .brand span {
            color: var(--crimson);
        }

        h1 {
            margin: 0;
            font-size: 4.2vh;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .rule {
            width: 9vh;
            height: 0.3vh;
            background: linear-gradient(90deg, var(--crimson), transparent);
        }

        #list {
            display: flex;
            flex-direction: column;
            gap: 0.8vh;
            max-height: 52vh;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #list li {
            display: flex;
            align-items: center;
            gap: 1.4vh;
            padding: 1.2vh 1.4vh;
            border-left: 0.35vh solid transparent;
            border-radius: 0 0.6vh 0.6vh 0;
            background: rgba(245, 245, 245, 0.04);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        #list li:hover {
            background: rgba(245, 245, 245, 0.08);
        }

        #list li.selected {
            border-left-color: var(--crimson);
            background: rgba(200, 16, 46, 0.18);
        }

        #list svg {
            flex: none;
            width: 2.6vh;
            height: 2.6vh;
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #list li.selected svg {
            stroke: var(--gold);
        }

        .text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .text strong {
            font-size: 2.2vh;
            font-weight: 700;
        }

        #list li.selected strong {
            color: var(--gold);
        }

        .text small {
            color: var(--muted);
            font-size: 1.6vh;
            letter-spacing: 0.04em;
        }

        #spawn {
            align-self: flex-start;
            padding: 1.3vh 4vh;
            border: none;
            border-radius: 0.6vh;
            background: var(--crimson);
            color: var(--white);
            font: inherit;
            font-size: 2.2vh;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 2vh rgba(200, 16, 46, 0.45);
        }

        #spawn:hover,
        #spawn:focus-visible {
            background: #e0203c;
            outline: none;
        }

        .hint {
            color: var(--muted);
            font-size: 1.5vh;
            letter-spacing: 0.06em;
        }

        .hint kbd {
            padding: 0.1vh 0.6vh;
            border: 1px solid rgba(245, 245, 245, 0.3);
            border-radius: 0.4vh;
            color: var(--white);
            font-family: inherit;
        }
    </style>
</head>
<body>
    <section id="picker" hidden>
        <div class="brand">HIGHCREST <span>RP</span></div>
        <h1>Choose your spawn</h1>
        <div class="rule"></div>
        <ul id="list"></ul>
        <button id="spawn" type="button">Spawn</button>
        <p class="hint"><kbd>&uarr;</kbd> <kbd>&darr;</kbd> to browse &middot; <kbd>Enter</kbd> to spawn</p>
    </section>

    <script>
        const ICONS = {
            last: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
            home: '<path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5M10 20v-5.5h4V20"/>',
            city: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
            airport: '<path d="M2.5 13.5 21 7.5l-1-2-6 1.6L8 3 6.5 3.6l3.7 4.6-4.4 1.2-2.3-1.8-1.3.5 1.5 3.4z"/><path d="M3 20h18"/>',
        };

        const picker = document.getElementById('picker');
        const list = document.getElementById('list');
        let options = [];
        let selected = 0;
        let spawning = false;

        const post = (name, body) => fetch(`https://${GetParentResourceName()}/${name}`, { method: 'POST', body: JSON.stringify(body) }).catch(() => {});

        function select(index, notify = true) {
            if (index < 0 || index >= options.length) return;
            selected = index;
            [...list.children].forEach((item, i) => item.classList.toggle('selected', i === index));
            list.children[index].scrollIntoView({ block: 'nearest' });
            if (notify) post('select', index + 1);
        }

        function spawn() {
            if (spawning || !options.length) return;
            spawning = true;
            post('spawn', selected + 1);
        }

        function open(data) {
            options = data.options || [];
            spawning = false;
            list.replaceChildren(...options.map((option, index) => {
                const item = document.createElement('li');
                item.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[option.kind] || ICONS.city}</svg>
                    <span class="text"><strong></strong><small></small></span>`;
                item.querySelector('strong').textContent = option.label;
                item.querySelector('small').textContent = option.area || '';
                item.addEventListener('click', () => select(index));
                item.addEventListener('dblclick', () => { select(index); spawn(); });
                return item;
            }));
            picker.hidden = false;
            requestAnimationFrame(() => picker.classList.add('open'));
            select(0, false);
        }

        function close() {
            picker.classList.remove('open');
            setTimeout(() => { picker.hidden = true; }, 600);
        }

        document.getElementById('spawn').addEventListener('click', spawn);

        window.addEventListener('keydown', (event) => {
            if (picker.hidden) return;
            if (event.key === 'ArrowDown' || event.key === 's') { select(Math.min(options.length - 1, selected + 1)); event.preventDefault(); }
            if (event.key === 'ArrowUp' || event.key === 'w') { select(Math.max(0, selected - 1)); event.preventDefault(); }
            if (event.key === 'Enter') spawn();
        });

        window.addEventListener('message', ({ data }) => {
            if (data.action === 'open') open(data);
            if (data.action === 'close') close();
        });

        // Browser preview: index.html?preview
        if (location.search.includes('preview')) {
            window.GetParentResourceName = () => 'preview';
            document.body.style.background = 'linear-gradient(135deg, #3a3f52, #1a1d28)';
            open({ options: [
                { kind: 'last', label: 'Last location', area: 'Vespucci Beach' },
                { kind: 'home', label: '1420 Grove Street', area: 'Your home' },
                { kind: 'city', label: 'Legion Square', area: 'Downtown' },
                { kind: 'city', label: 'Vinewood Boulevard', area: 'Vinewood' },
                { kind: 'city', label: 'Del Perro Pier', area: 'Del Perro' },
                { kind: 'city', label: 'Pink Cage Motel', area: 'Alta' },
                { kind: 'airport', label: 'Los Santos International', area: 'Airport arrivals' },
            ] });
        }
    </script>
</body>
</html>
