<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tsunami Ticker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Emergency alert ticker across the top of the screen. Never takes the mouse or keyboard. -->
    <div id="ticker" class="ticker" hidden>
        <div class="label"><span class="dot"></span>EMERGENCY ALERT<span id="previewTag" class="preview" hidden>PREVIEW</span></div>
        <div class="track"><div id="scroll" class="scroll"></div></div>
        <div class="count">EVACUATION <b id="countdown">2:00</b></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
